aid: noviconnect
name: Novi Connect
description: >-
  Novi Connect (Novi) is an AI shopping optimization platform and data infrastructure for CPG and
  retail brands. It connects brands, certification bodies, and major retailers to verify, standardize,
  and distribute product data so products are accurately understood, ranked, and recommended by AI
  shopping systems and agentic search. Products include the AI Shopping Optimizer for SKU-level
  product-feed optimization and the Product Authority Builder for verified direct data distribution
  across retailers and marketplaces. Backed by Felicis. No public developer API surface is currently
  published; product docs are hosted on Notion and customer access is via login apps.
